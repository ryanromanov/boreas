[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boreas-lang"
version = "0.1.0"
description = "A Fortran-flavored programming language"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
boreas = "boreas.cli:main"

[tool.setuptools]
packages = ["boreas"]
